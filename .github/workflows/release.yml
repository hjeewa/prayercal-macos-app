name: Release macOS app

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version
        run: test "$GITHUB_REF_NAME" = "v$(<VERSION)"

      - name: Run tests
        run: swift test

      - name: Build universal DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./package-dmg.sh

      - name: Generate signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p update-archive
          cp outputs/PrayerCal.dmg update-archive/PrayerCal.dmg
          echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/" \
            --full-release-notes-url "https://github.com/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME" \
            --maximum-versions 1 \
            update-archive
          cp update-archive/appcast.xml outputs/appcast.xml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          outputs/PrayerCal.dmg
          outputs/appcast.xml
          --title "PrayerCal $GITHUB_REF_NAME"
          --generate-notes
